{% extends "base.html" %}
{% block content %}
<div class="container">
<div class="row">
    <div class="col-10">
        <h2>Popular Products</h2>
    </div>
    <div class="col-2">
        <button class="btn btn-primary">See All</button>
    </div>
</div>
<div class="row">
    
    {% for product in  products %}
    <div class="col-3 my-2 ">
        <div class="card" style="box-shadow: rgba(17, 12, 46, 0.15) 0px 48px 100px 0px;">
        <img src="{{product.productImage.url}}" class="card-img-top" alt="..." width="100%" height="380px" ;">
        
        <div class="card-body " style="padding:10px!important;">
                <h6 class="card-title ">{{product.productName|capfirst}}</h6>
                <h4 class="card-text text-danger">${{product.price}}</h4>
         
        </div>
        
        </div>
    </div>
    {% endfor %}
</div>
</div>
{% endblock content %}
